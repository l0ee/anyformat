name: Bug report
description: Report a reproducible problem with tracing, conversion, or the interface.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Single SVG vectorizer
        - Batch SVG vectorizer
        - Format converter
        - Other interface behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Do not attach private or sensitive files.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant errors
      render: shell
